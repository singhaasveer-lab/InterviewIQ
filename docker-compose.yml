version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: interviewiq_db
    environment:
      POSTGRES_USER: interviewiq
      POSTGRES_PASSWORD: interviewiq_secret
      POSTGRES_DB: interviewiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewiq -d interviewiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interviewiq_backend
    environment:
      - DATABASE_URL=postgresql://interviewiq:interviewiq_secret@db:5432/interviewiq_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your environment or a root .env file}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interviewiq_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
